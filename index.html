<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agent 知识框架 · 工程师视角</title>
<meta name="description" content="面向后端/前端工程师的 AI Agent 技术知识框架：分层模块、动效图解、最小代码、面试考点与求职地图。">
<style>
/* ============ tokens ============ */
:root{
  --bg:#080b10; --bg2:#0d131b; --panel:#101822; --panel2:#131d28;
  --line:#1d2b3a; --line2:#26394d;
  --ink:#dde8f4; --ink2:#b6c8dc; --muted:#8499b3; --faint:#5d718a;
  --te:#5eead4; --in:#8b93fd; --am:#fbbf24; --ro:#f87171; --gr:#34d399; --bl:#38bdf8;
  --accent:var(--te);
  --radius:14px; --radius-sm:9px;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",'PingFang SC',Roboto,sans-serif;
  --shadow:0 18px 40px -24px rgba(0,0,0,.8);
  --grid:rgba(255,255,255,.028);
}
html[data-theme="light"]{
  --bg:#f6f8fb; --bg2:#ffffff; --panel:#ffffff; --panel2:#f2f5f9;
  --line:#dde5ef; --line2:#c8d5e5;
  --ink:#12202f; --ink2:#2c4055; --muted:#5b7288; --faint:#8497ab;
  --te:#0d9488; --in:#5b5bd6; --am:#b45309; --ro:#dc2626; --gr:#047857; --bl:#0284c7;
  --shadow:0 16px 34px -22px rgba(20,40,70,.35);
  --grid:rgba(20,40,70,.045);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.72; -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:34px 34px;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
::selection{background:rgba(94,234,212,.28)}

/* ============ shell ============ */
#app{display:grid;grid-template-columns:288px minmax(0,1fr);align-items:start}
#sidebar{
  position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;
  border-right:1px solid var(--line);background:linear-gradient(180deg,var(--bg2),var(--bg));
  padding:18px 14px 40px;
}
#main{min-width:0;width:100%;margin:0 auto;padding:26px 34px 90px;max-width:1120px}
.brand{display:flex;gap:10px;align-items:flex-start;margin:2px 6px 14px}
.brand .logo{width:34px;height:34px;flex:0 0 auto;border-radius:10px;
  background:radial-gradient(circle at 30% 25%,var(--te),transparent 60%),radial-gradient(circle at 75% 75%,var(--in),transparent 55%),var(--panel2);
  border:1px solid var(--line2);position:relative}
.brand .logo::after{content:"";position:absolute;inset:9px;border-radius:50%;border:1.5px solid var(--ink);opacity:.55;
  animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.brand h1{margin:0;font-size:15px;letter-spacing:.2px}
.brand p{margin:1px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:.4px}
.searchbox{margin:0 6px 14px}
.searchbox input{
  width:100%;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:13px;font-family:inherit}
.searchbox input:focus{outline:none;border-color:var(--line2);box-shadow:0 0 0 3px rgba(94,234,212,.12)}
.navgrp{margin:0 0 6px;padding:12px 8px 4px;font-size:10.5px;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--faint);font-weight:700;display:flex;justify-content:space-between}
.navgrp .hint{letter-spacing:0;text-transform:none;font-weight:500;color:var(--faint)}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:7px 9px;border-radius:8px;border:1px solid transparent;background:none;
  color:var(--ink2);cursor:pointer;font-size:13.3px;line-height:1.4}
.nav-item:hover{background:var(--panel);color:var(--ink);text-decoration:none}
.nav-item.active{background:var(--panel2);border-color:var(--line2);color:var(--ink);font-weight:600}
.nav-item .no{font-family:var(--mono);font-size:10.5px;color:var(--faint);width:16px;flex:0 0 auto;text-align:right}
.nav-item .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .tick{width:15px;height:15px;flex:0 0 auto;border-radius:4px;border:1px solid var(--line2);position:relative}
.nav-item.done .tick{background:var(--gr);border-color:var(--gr)}
.nav-item.done .tick::after{content:"";position:absolute;left:4px;top:1px;width:5px;height:9px;
  border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.nav-item.static{font-weight:600}
.nav-item.static .tick{display:none}
.progcard{margin:14px 6px 4px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.progcard .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:7px}
.bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--te),var(--in));transition:width .4s ease}
.sidefoot{display:flex;gap:8px;margin:12px 6px 0}
.mini{flex:1;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
  color:var(--muted);font-size:11.5px;cursor:pointer}
.mini:hover{color:var(--ink);border-color:var(--line2)}

/* ============ main blocks ============ */
.crumb{font-size:12px;color:var(--faint);letter-spacing:.3px;margin:0 0 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb b{color:var(--ink2);font-weight:600}
.view{animation:fadeUp .34s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
h2.title{margin:0;font-size:29px;line-height:1.25;letter-spacing:-.4px}
h2.title>span{display:block;font-family:var(--mono);font-size:12px;color:var(--faint);
  letter-spacing:1.4px;text-transform:uppercase;font-weight:500;margin-top:7px}
.lede{color:var(--ink2);font-size:15.5px;margin:14px 0 0;max-width:76ch}
h3.sec{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);
  margin:34px 0 12px;font-weight:700;display:flex;align-items:center;gap:10px}
h3.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 0}
.chip{font-size:11.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--line2);
  color:var(--ink2);background:var(--panel);white-space:nowrap}
.chip.core{color:var(--bg);background:var(--te);border-color:var(--te);font-weight:700}
.chip.hot{color:var(--bg);background:var(--bl);border-color:var(--bl);font-weight:700}
.chip.plus{color:var(--ink2)}
.chip.bar-lo{border-color:var(--gr);color:var(--gr)}
.chip.bar-mid{border-color:var(--am);color:var(--am)}
.chip.bar-hi{border-color:var(--ro);color:var(--ro)}

/* analogy */
.analogy{margin:22px 0 0;padding:18px 20px 18px 22px;border-left:3px solid var(--accent);
  background:linear-gradient(90deg,rgba(94,234,212,.07),transparent 70%);
  border-radius:0 var(--radius) var(--radius) 0}
html[data-theme="light"] .analogy{background:linear-gradient(90deg,rgba(13,148,136,.07),transparent 70%)}
.analogy .k{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent);font-weight:700}
.analogy .m{font-size:17.5px;margin:6px 0 0;font-weight:650;letter-spacing:-.2px}
.analogy .w{margin:7px 0 0;color:var(--ink2);font-size:14px}

/* cards */
.grid{display:grid;gap:12px}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.card{padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);transition:.2s}
.card:hover{border-color:var(--line2);transform:translateY(-1px)}
.card h4{margin:0 0 5px;font-size:14.5px;letter-spacing:-.1px}
.card h4 em{font-family:var(--mono);font-style:normal;font-size:11px;color:var(--faint);margin-left:7px}
.card p{margin:0;font-size:13.4px;color:var(--ink2)}
.card p b{color:var(--ink)}

/* list */
ul.tick{list-style:none;margin:0;padding:0}
ul.tick li{position:relative;padding-left:18px;margin:0 0 8px;font-size:13.6px;color:var(--ink2)}
ul.tick li::before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:2px;
  background:var(--accent);opacity:.75}
ul.tick.warn li::before{background:var(--ro)}
ul.tick li b{color:var(--ink)}

/* code */
.codewrap{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--bg2)}
.codebar{display:flex;align-items:center;gap:10px;padding:7px 11px;border-bottom:1px solid var(--line);background:var(--panel)}
.codebar .lang{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.6px}
.codebar .file{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy{padding:3px 9px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);color:var(--muted);font-size:11.5px;cursor:pointer}
.copy:hover{color:var(--ink)}
pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:12.6px;line-height:1.65;color:var(--ink2)}
pre .c{color:var(--faint)}
pre .s{color:var(--am)}
pre .k{color:var(--in)}
pre .f{color:var(--te)}
.code-note{font-size:12.6px;color:var(--muted);margin:8px 2px 0;padding-left:11px;border-left:2px solid var(--line2)}

/* diagram */
.diagram{border:1px solid var(--line);border-radius:var(--radius);background:var(--bg2);overflow:hidden;box-shadow:var(--shadow)}
.dgbar{display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid var(--line);background:var(--panel)}
.dgbar .t{font-size:12.5px;font-weight:600;color:var(--ink2);flex:1;min-width:0}
.dgbar .t em{font-style:normal;color:var(--faint);font-weight:400;font-size:11.5px;margin-left:7px}
.dgbtn{padding:4px 11px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink2);font-size:12px;cursor:pointer}
.dgbtn:hover{border-color:var(--accent);color:var(--ink)}
.dgbtn:disabled{opacity:.4;cursor:default}
.dgstage{padding:10px 6px 6px;overflow-x:auto}
.dgstage svg{display:block;width:100%;height:auto;max-width:100%;min-width:600px;font-family:var(--sans)}
.dgcap{font-size:12.4px;color:var(--muted);padding:9px 16px 13px;border-top:1px solid var(--line);background:var(--panel)}
.dgcap b{color:var(--ink2)}
.dgstep{display:flex;gap:10px;align-items:baseline;padding:10px 16px;font-size:13.2px;color:var(--ink2);
  background:linear-gradient(90deg,rgba(94,234,212,.06),transparent);border-bottom:1px solid var(--line);min-height:40px}
.dgstep .idx{font-family:var(--mono);font-size:11px;color:var(--accent);flex:0 0 auto;letter-spacing:.5px}
.nx .dim{opacity:.13}
.nx .bad-lbl{fill:var(--ro)}
.nx .hot-lbl{fill:var(--te)}
.nx text{pointer-events:none}
.nx a{cursor:pointer}
/* svg primitives */
.nx rect,.nx circle,.nx path,.nx polygon{transition:stroke .25s,fill .25s,opacity .25s}
.nx .box{fill:var(--panel2);stroke:var(--line2);stroke-width:1.2;rx:9}
.nx .box.on{stroke:var(--accent);fill:rgba(94,234,212,.1)}
.nx .box.on2{stroke:var(--in);fill:rgba(139,147,253,.12)}
.nx .box.bad{stroke:var(--ro);fill:rgba(248,113,113,.1)}
.nx .lbl{fill:var(--ink);font-size:12.5px;font-weight:600}
.nx .sub{fill:var(--muted);font-size:10.6px}
.nx .tiny{fill:var(--faint);font-size:9.6px;font-family:var(--mono)}
.nx .wire{stroke:var(--line2);stroke-width:1.3;fill:none}
.nx .wire.dash{stroke-dasharray:4 4}
.nx .flow{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:7 7;animation:dash 1s linear infinite}
.nx .flow.stop{animation-play-state:paused}
.nx .flow.v2{stroke:var(--in)}
.nx .flow.v3{stroke:var(--am)}
@keyframes dash{to{stroke-dashoffset:-14}}
.nx .glow{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.28}50%{opacity:1}}
.nx .pk{fill:var(--te);opacity:0}
.nx .lgd{fill:var(--faint);font-size:10.5px;font-family:var(--mono)}
.clickable{cursor:pointer}
.clickable:hover .box{stroke:var(--accent)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13.2px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.tbl th,.tbl td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{background:var(--panel2);color:var(--ink2);font-size:11.5px;letter-spacing:.7px;text-transform:uppercase;font-weight:700}
.tbl tr:last-child td{border-bottom:none}
.tbl td b{color:var(--ink)}
.tbl tbody tr:hover{background:var(--panel)}
.tbl .mono{font-family:var(--mono);font-size:12px;color:var(--accent)}

/* qa */
.qa{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:0;margin:0 0 9px;overflow:hidden}
.qa>summary{list-style:none;cursor:pointer;padding:11px 15px;font-size:13.8px;font-weight:600;color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.qa>summary::-webkit-details-marker{display:none}
.qa>summary::before{content:"Q";font-family:var(--mono);font-size:10.5px;color:var(--accent);
  border:1px solid var(--line2);border-radius:5px;padding:1px 5px;margin-top:2px;flex:0 0 auto}
.qa>summary:hover{background:var(--panel2)}
.qa .body{padding:0 15px 13px 15px;font-size:13.4px;color:var(--ink2);border-top:1px dashed var(--line2);margin-top:-1px;padding-top:11px}
.qa .body b{color:var(--ink)}

/* practice checklist */
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);
  border-radius:var(--radius-sm);background:var(--panel);margin-bottom:8px;cursor:pointer}
.task:hover{border-color:var(--line2)}
.task input{margin:4px 0 0;accent-color:var(--gr);cursor:pointer}
.task.done span{color:var(--faint);text-decoration:line-through}
.task span{font-size:13.4px;color:var(--ink2)}

/* next nav */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:38px}
.pager a,.pager div{padding:13px 15px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);min-height:62px}
.pager a:hover{border-color:var(--accent);text-decoration:none}
.pager .d{font-size:11px;color:var(--faint);letter-spacing:.9px;text-transform:uppercase}
.pager .n{font-size:14.5px;color:var(--ink);font-weight:600;margin-top:3px}
.pager .r{text-align:right}
.pager div.dis{opacity:.4}

/* stage timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--te),var(--in),transparent)}
.tl .step{position:relative;margin-bottom:18px}
.tl .step::before{content:"";position:absolute;left:-22px;top:6px;width:11px;height:11px;border-radius:50%;
  background:var(--bg);border:2px solid var(--accent)}
.tl .step h4{margin:0 0 3px;font-size:15px}
.tl .step h4 em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:8px}
.tl .step p{margin:0;font-size:13.3px;color:var(--ink2)}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.2px;color:var(--muted);margin:12px 0 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.note{font-size:12.6px;color:var(--muted);background:var(--panel);border:1px dashed var(--line2);
  border-radius:var(--radius-sm);padding:10px 13px;margin:12px 0 0}
.note b{color:var(--ink2)}
.ph{padding:16px;border:1px dashed var(--line2);border-radius:var(--radius);color:var(--faint);font-size:13px;background:var(--panel)}
#toast{position:fixed;right:18px;bottom:18px;padding:9px 14px;border-radius:9px;background:var(--panel2);
  border:1px solid var(--accent);color:var(--ink);font-size:13px;opacity:0;transform:translateY(9px);transition:.25s;pointer-events:none;z-index:50}
#toast.show{opacity:1;transform:none}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-radius:4px;padding:0 4px;color:var(--muted)}

/* responsive */
#menuBtn{display:none}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #sidebar{position:fixed;left:0;top:0;width:280px;z-index:40;transform:translateX(-101%);transition:transform .25s ease;box-shadow:var(--shadow)}
  body.nav-open #sidebar{transform:none}
  #menuBtn{display:inline-flex;position:fixed;left:12px;top:12px;z-index:45;padding:7px 12px;border-radius:9px;
    border:1px solid var(--line2);background:var(--panel2);color:var(--ink);font-size:13px;cursor:pointer}
  body.nav-open #menuBtn{left:auto;right:14px;top:16px;background:var(--panel2);border-color:var(--accent)}
  body.nav-open .brand{padding-right:66px}
  #main{padding:56px 16px 70px}
  h2.title{font-size:23px}
  .pager{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .nx .flow{animation:none}
}
</style>
</head>
<body>
<button id="menuBtn">目录</button>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <h1>AI Agent 知识框架</h1>
        <p>ENGINEER-FIRST · 14 MODULES</p>
      </div>
    </div>
    <div class="searchbox"><input id="q" type="search" placeholder="搜索模块 / 概念…" autocomplete="off"></div>
    <nav id="nav"></nav>
    <div class="progcard">
      <div class="row"><span>学习进度</span><span id="progtxt">0 / 14</span></div>
      <div class="bar"><i id="progbar" style="width:0%"></i></div>
    </div>
    <div class="sidefoot">
      <button class="mini" id="themeBtn">切换主题</button>
      <button class="mini" id="resetBtn">重置进度</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ===================================================================
   AI Agent 知识框架 — 单文件零依赖
   结构：GROUPS / MODULES(内容) / DIAG(动效图示) / VIEWS(路由渲染)
   =================================================================== */

const GROUPS = [
  {id:"base", name:"基础层 · 模型为什么会这样",  hint:"先建立物理约束"},
  {id:"cap",  name:"能力层 · 手、脑、记忆",       hint:"agent 的最小闭环"},
  {id:"sys",  name:"系统层 · 编排与生态",         hint:"规模化与协作"},
  {id:"eng",  name:"工程层 · 可靠、可观测、可控", hint:"你的差异化优势"}
];

/* ---------------------------- 内容数据 ---------------------------- */
const MODULES = [
{
  id:"llm-runtime", group:"base", no:1,
  title:"LLM 运行机制", en:"How the model actually runs",
  weight:5, demand:"core", barrier:"low",
  analogy:{
    k:"工程类比",
    m:"把它当成一个无状态的远程纯函数：输入一串 token，输出一个 token 的概率分布。",
    w:"没有内存、没有会话、没有副作用。你要求的每次「记住」，都得你自己把历史重新当参数传进去；它的「思考」就是把下一个 token 猜出来。"
  },
  concepts:[
    {t:"token 与分词", d:"模型处理的是 subword 切分后的整数 id，不是字符。计费、长度限制、截断全都按 token 算。<b>中文常见 1 字 ≈ 1～2 token</b>，代码和 JSON 因为符号多也偏贵。", e:"tokenizer"},
    {t:"自回归解码", d:"逐 token 生成，每步都要跑一次完整前向。所以<b>输出长度直接决定延迟</b>，首 token 延迟（TTFT）取决于输入长度，后续取决于生成长度。", e:"autoregressive"},

const LS_KEY = "agent-study-v1";
const state = load();

function load(){
  let raw = {};
  try { raw = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) { raw = {}; }
  return {
    done: new Set(raw.done || []),
    tasks: raw.tasks || {},            // { "moduleId::idx": true }
    theme: raw.theme || "dark"
  };
}
function save(){
  localStorage.setItem(LS_KEY, JSON.stringify({
    done: [...state.done], tasks: state.tasks, theme: state.theme
  }));
  if (location.hash.startsWith("#/m/")) {
    const id = location.hash.slice(4);
    const el = document.querySelector('.nav-item[data-id="'+id+'"]');
    if (el) el.classList.toggle("done", state.done.has(id));
    updateProgress();
  }
}
function updateProgress(){
  const t = MODULES.length;
  document.getElementById("progtxt").textContent = state.done.size + " / " + t;
  document.getElementById("progbar").style.width = (state.done.size / t * 100) + "%";
}

/* ---------------------------- 小工具 ---------------------------- */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hl(code){
  // 极简高亮：注释/字符串/关键字，够用即可，不追求完备
  let s = esc(code);
  s = s.replace(/(&quot;[^&]*?&quot;|'[^']*')/g, m => '<span class="s">'+m+'</span>');
  s = s.replace(/(#[^\n]*|--[^\n]*)/g, m => '<span class="c">'+m+'</span>');
  s = s.replace(/\b(def|class|return|for|if|else|while|import|from|raise|with|not|and|or|in|await|async|None|True|False)\b/g,
      m => '<span class="k">'+m+'</span>');
  s = s.replace(/\b([a-zA-Z_]\w*)(?=\()/g, m => '<span class="f">'+m+'</span>');
  return s;
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 1800);
}
function demandChip(d){
  return d==="core" ? '<span class="chip core">岗位核心能力</span>'
       : d==="hot" ? '<span class="chip hot">高频考点</span>'
       : '<span class="chip plus">加分项</span>';
}
function barrierChip(b){
  const m = {low:["bar-lo","上手门槛低"], mid:["bar-mid","门槛中等"], high:["bar-hi","门槛较高"]};
  const [cls,txt] = m[b];
  return '<span class="chip '+cls+'">'+txt+'</span>';
}

function filterNav(q){
  q = q.trim().toLowerCase();

    const m = byId(el.dataset.id);

    el.style.display = hay.includes(q) ? "" : "none";
  });
}

function N(id, x, y, w, h, l, sub, o){
  o = o || {};
  const cx = x + w / 2;
  const g = `<g class="nx-n" data-n="${id}">
    <rect class="box" x="${x}" y="${y}" width="${w}" height="${h}" rx="9"/>
    <text class="lbl" x="${cx}" y="${y + (sub ? h/2 - 3 : h/2 + 5)}" text-anchor="middle">${l}</text>
    ${sub ? `<text class="sub" x="${cx}" y="${y + h/2 + 13}" text-anchor="middle">${sub}</text>` : ""}
  </g>`;
  return o.href ? `<a href="${o.href}" data-nav="${o.href}">${g}</a>` : g;
}
function E(id, d, l, o){
  o = o || {};
  const pid = MK + "-" + id;
  return `<g class="nx-e" data-e="${id}">
    <path id="${pid}" class="wire" d="${d}"${o.noarrow ? "" : ` marker-end="url(#ar-${MK})"`}/>
    ${l && o.lx != null ? `<text class="sub" x="${o.lx}" y="${o.ly}" text-anchor="middle">${l}</text>` : ""}
  </g>`;
}
const TT = (x, y, l, cls, an) => `<text class="${cls || "tiny"}" x="${x}" y="${y}" text-anchor="${an || "start"}">${l}</text>`;
const PKT = (ref, dur) => `<circle class="pk" r="4.5" style="opacity:.95">
  <animateMotion dur="${dur}s" repeatCount="indefinite"><mpath href="#${MK}-${ref}"/></animateMotion></circle>`;

function dg(key, title, w, h, body, steps, cap, every){
  DIAG[key] = {
    title, cap, steps, w, h,
    svg: `<svg viewBox="0 0 ${w} ${h}" class="nx" role="img" aria-label="${title}">
      <defs><marker id="ar-${key}" viewBox="0 0 10 10" refX="8.5" refY="5"
        markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" style="fill:var(--line2)"/></marker></defs>${body}</svg>`,
    every: every || 2100
  };
}

      "<b>管线：</b>结构感知切块 → 向量 + BM25 混合召回 → RRF → rerank → top-5 带引用注入。",
      "<b>可核验：</b>每条结论带 cite；做 faithfulness 校验，无依据时拒答而不是补全。",
      "<b>分层评测：</b>先量 recall@k / MRR，再量答案质量与引用正确率。检索不达标时改 prompt 无效。",
      "<b>更新：</b>增量索引与删除同步（含权限变更），否则旧权限文档仍可被召回。",

const VIEWS = {
  overview: viewOverview,
  path: viewPath, jobs: viewJobs, interview: viewInterview
};

function route(){
  const h = location.hash || "#/overview";
  let html, key;
  if (h.startsWith("#/m/")) { key = h.slice(4); html = viewModule(key); }
  else { key = h.slice(2).split("?")[0] || "overview"; html = (VIEWS[key]||viewOverview)(); }
  document.getElementById("main").innerHTML = html;
  document.querySelectorAll("#nav .nav-item").forEach(el=>el.classList.toggle("active", el.getAttribute("href")===h));
  document.body.classList.remove("nav-open");
  window.scrollTo(0,0);
  wireView(key);
  updateProgress();
}

/* 播放控制：统一步骤引擎，图示进入视口才推进 */
function applyStep(box, d, i){
  const n = d.steps.length;
  const idx = ((i % n) + n) % n;
  const st = d.steps[idx];
  box.querySelectorAll("[data-n]").forEach(g=>{
    const r = g.querySelector(".box");
    if (r) r.classList.remove("on","on2","bad");
    g.classList.remove("dim");
  });
  box.querySelectorAll("[data-e]").forEach(g=>{
    const p = g.querySelector("path");
    if (p) p.classList.remove("flow","v2","v3");
    g.classList.remove("dim");
  });
  (st.hl || []).forEach(e=>{
    const id  = Array.isArray(e) ? e[0] : e;
    const cls = Array.isArray(e) ? e[1] : "on";
    const g = box.querySelector('[data-n="' + id + '"]');
    if (g) { const r = g.querySelector(".box"); if (r) r.classList.add(cls); return; }
    const ge = box.querySelector('[data-e="' + id + '"]');
    if (ge) { const p = ge.querySelector("path"); p.classList.add("flow"); if (cls !== "on") p.classList.add(cls); }
  });
  (st.flow || []).forEach(id=>{
    const ge = box.querySelector('[data-e="' + id + '"]');
    if (ge) ge.querySelector("path").classList.add("flow");
  });
  (st.dim || []).forEach(id=>{
    const g = box.querySelector('[data-n="' + id + '"]') || box.querySelector('[data-e="' + id + '"]');
    if (g) g.classList.add("dim");
  });
  const bar = box.querySelector(".dgstep");
  if (bar) {
    bar.querySelector(".idx").textContent = (idx + 1) + " / " + n;
    bar.querySelector(".txt").textContent = st.note;
  }
}

function wireView(key){
  document.querySelectorAll(".diagram").forEach(box=>{
    const d = DIAG[box.dataset.diagram];
    if (!d) return;
    const svg = box.querySelector("svg");
    const api = { i: 0, playing: true, visible: false, timer: null };
    const every = d.every || 2100;

    if (d.steps) applyStep(box, d, 0);

    const tick = ()=>{ api.i++; applyStep(box, d, api.i); };
    const startTimer = ()=>{ clearInterval(api.timer); if (api.playing && api.visible && d.steps) api.timer = setInterval(tick, every); };
    const setPlaying = (on)=>{
      api.playing = on;
      box.querySelectorAll(".flow").forEach(p=>p.classList.toggle("stop", !on));
      try { on ? svg.unpauseAnimations() : svg.pauseAnimations(); } catch (e) {}
      startTimer();
    };

    new IntersectionObserver(es=>{
      es.forEach(e=>{ api.visible = e.isIntersecting; startTimer(); });
    }, { threshold: .18 }).observe(box);

    box.querySelectorAll("[data-act]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const act = btn.dataset.act;
        if (act === "toggle") { setPlaying(!api.playing); btn.textContent = api.playing ? "暂停" : "播放"; }
        if (act === "step")   { if (api.playing) { setPlaying(false); box.querySelector('[data-act="toggle"]').textContent = "播放"; } tick(); }
        if (act === "replay") { api.i = 0; applyStep(box, d, 0); setPlaying(true); box.querySelector('[data-act="toggle"]').textContent = "暂停"; }
      });
    });
  });
}

/* 全局点击委托 */
document.addEventListener("click", e=>{
  const cp = e.target.closest(".copy");
  if(cp){
    const txt = cp.dataset.code;
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
      .then(()=>toast("已复制到剪贴板"))
      .catch(()=>{
        const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta);
        ta.select(); try{document.execCommand("copy"); toast("已复制到剪贴板");}catch(err){toast("复制失败，请手动选择");}
        ta.remove();
      });
    return;
  }
  const dn = e.target.closest("[data-done]");
  if(dn){
    const id = dn.dataset.done;
    if(state.done.has(id)) state.done.delete(id); else state.done.add(id);
    save(); route(); toast(state.done.has(id)?"已标记学完":"已取消标记");
    return;
  }
});
document.addEventListener("change", e=>{
  const cb = e.target.closest(".task input");
  if(cb){
    state.tasks[cb.dataset.key] = cb.checked;
    if(!cb.checked) delete state.tasks[cb.dataset.key];
    cb.closest(".task").classList.toggle("done", cb.checked);
    save();
  }
});

/* boot */
document.getElementById("themeBtn").addEventListener("click", ()=>{
  state.theme = state.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = state.theme;
  save(); toast(state.theme==="dark"?"深色主题":"浅色主题");
});
document.getElementById("resetBtn").addEventListener("click", ()=>{
  state.done.clear(); Object.keys(state.tasks).forEach(k=>delete state.tasks[k]);
  save(); route(); toast("进度已重置");
});
document.getElementById("q").addEventListener("input", ev=>filterNav(ev.target.value));
document.getElementById("menuBtn").addEventListener("click", ()=>document.body.classList.toggle("nav-open"));
document.addEventListener("keydown", e=>{
  if(e.target.matches("input")) return;
  if(!location.hash.startsWith("#/m/")) return;
  const i = ordered.findIndex(m=>m.id===location.hash.slice(4));
  if(e.key==="ArrowRight" && ordered[i+1]) location.hash = "#/m/"+ordered[i+1].id;
  if(e.key==="ArrowLeft"  && ordered[i-1]) location.hash = "#/m/"+ordered[i-1].id;
});

document.documentElement.dataset.theme = state.theme;
buildNav();
window.addEventListener("hashchange", route);
route();
</script>
